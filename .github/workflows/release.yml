# EVERY JOB HERE RUNS ON GITHUB'S RUNNERS, like every job of every workflow in this repository and
# for the same one reason: it is public, hosted runners are free for a public repository, and a
# self-hosted runner on one would run a fork's pull request on the Unraid host. The rule and its
# reasons are at the top of tools/ci/check-runners.ps1, which ci.yml runs as a step; this file is
# no exception to it and is named in it nowhere
# (tasks/phase-3.12/03-ci-where-a-public-repository-may-run.md). It is also the file that ships -
# the images every repeater's update trusts, signed with RELEASE_SIGNING_KEY - and a machine that
# begins each job new and is gone after it is where a release should be built in any case
# (keys/README.md). It runs when a person presses a button, so its minutes are few.
#
# The release: a GitHub Release a person, MeshMaster's catalogue and the Walter can all use.
#
#   Run workflow        -> refuse before anything is built -> build every board -> sign ->
#                          verify the signature -> publish -> move the notes and the version on
#   Run workflow, with  -> the same jobs, published nowhere: a rehearsal whose artifact is the
#   *dry run* ticked       proof that the publishing path works. Input "ref": what to rehearse on.
#
# **THE BUTTON PUBLISHES, AND NOTHING IS TYPED** (tasks/phase-3.11/01-a-release-from-the-button.md,
# decided by Thomas on 13 November 2026; meshmaster.dk releases the same way and this file follows
# its release.yml at bfe80bf). There is no tag trigger: a tag pushed by hand starts nothing, and
# the tag of a release is made by `gh release create` here, on the commit that was built.
#
#   the version    VERSION at the root, and no other file (tools/release/version.py). It names the
#                  release that comes NEXT; after a release this workflow moves it to the next
#                  patch. A bigger step is that one line edited beforehand.
#   the notes      the lines the tasks left in release-notes/unreleased/, in the order they
#                  merged, then release-notes/standing.md, then what the manifest generates
#                  (tools/release/release_notes.py; docs/release.md, *The notes*).
#   the refusals   a ref that is not main, a ref input on a release, no waiting line, and a
#                  version whose tag already exists - each before anything is built, each one
#                  sentence (tools/release/gate.py).
#
# The shape is twinoak/meshmaster-agent-firmware's release.yml at 51faafb4: a ci-green job that
# refuses a commit CI has not passed, the build, the publish, and a dry run that is the same jobs
# with one step fewer. What is different here is what a repeater release carries
# (spec/FIRMWARE-MANIFEST.md): not only the images but a manifest.json that says what each image
# is, the signature over it, and SHA256SUMS.
#
# Per board, named twinoak-<role>-<board>-<band>-vX.Y.Z.<ext>:
#   .bin   the raw application binary for the Walter's SWD flasher, with its load_address
#   .zip   the nrfutil DFU package, for a laptop on the adapter's USB-C port
#   .uf2   for the bootloader's drag-and-drop drive
# once per board family, under every image of it (spec/FIRMWARE-MANIFEST.md section 4a):
#   twinoak-base-<family>-<bootloader>-s140-6.1.1.hex
#          the base under the application - MBR, SoftDevice, bootloader - that the Walter writes
#          once to a factory radio on a person's `rak provision` (spec/SYSTEM.md S-5a). Vendored
#          at boards/base/<family>/, held to its pin by tools/base/check.py; build_release.py
#          refuses a family image without it and sign_manifest.py refuses to sign one. The
#          notices its licences ask for are THIRD-PARTY-NOTICES, beside the manifest.
# and once for the release:
# Every image carries its own descriptor (spec/FIRMWARE-MANIFEST.md section 4), and
# --require-descriptor refuses to publish an image that does not, or whose descriptor is not
# what its manifest entry says. The local dry run passes the same flag (tools/verify.ps1).
#
#   manifest.json      the canonical manifest (spec/FIRMWARE-MANIFEST.md section 2)
#   manifest.json.sig  one Ed25519 line over its bytes (section 3)
#   SHA256SUMS         over every file above, the manifest included
#
# **A release with no RELEASE_SIGNING_KEY fails.** A release is signed or it is not a release; the
# message says how the key is made (keys/README.md). A dry run signs with the specification's
# public test key and its version is 0.0.0-dryrun+<sha7>, which is not a release version, so
# tools/release/sign_manifest.py would refuse to sign a real release the same way.
#
# **Merging never releases.** A release is a person pressing *Run workflow* (tasks/RUNBOOK.md
# section 4).

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse only: the same jobs, the test key, 0.0.0-dryrun, nothing published."
        type: boolean
        default: false
      ref:
        description: "Dry run only: the commit or branch to rehearse on. Empty: the ref this run was started on."
        type: string
        default: ""

permissions:
  contents: read

# One release at a time, and none is ever cancelled half-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The same pin as ci.yml, which is this machine's (tasks/README.md, phase 0's task 01).
  PIO_VERSION: "6.2.0"
  PYTHONUNBUFFERED: "1"

jobs:
  # Nothing is released that has nothing to say, nothing whose build and tests are red or unknown,
  # and nothing that cannot be signed. All of it is settled here, before anything is built.
  ci-green:
    name: ci is green for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
      tag: ${{ steps.commit.outputs.tag }}
      release: ${{ steps.commit.outputs.release }}
      envs: ${{ steps.envs.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Every tag, for the refusal that reads them, and every commit, for the walk back to the
          # ci run that stands for a release-notes commit (tools/release/gate.py).
          fetch-depth: 0

      # The three refusals that need no build, in one sentence each: the ref, the waiting lines,
      # and a version whose tag already exists. A rehearsal is refused for none of them.
      #
      # Whether this run is a rehearsal is read as the text `true`, in the shell, and never as a
      # `${{ }}` comparison: a typed input arrives as a boolean when GitHub's own form sends it
      # and as the string "true" when `gh workflow run -f dry_run=true` does, and `"true" != true`
      # is TRUE in an expression - which would have run a release's refusals over a rehearsal.
      - name: What this release would be, and what it is refused for
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "a rehearsal: refused for none of a release's reasons, and published nowhere"
            exit 0
          fi
          python3 tools/release/gate.py check \
            --ref-name "$GITHUB_REF_NAME" --ref-input "$REF_INPUT" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The commit, and the version it is released as
        id: commit
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            # Not a release version (spec/FIRMWARE-MANIFEST.md section 3): the test key may sign
            # it, and no artifact of a rehearsal can be mistaken for a release.
            version="0.0.0-dryrun+${sha:0:7}"
            tag=""
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # VERSION, and no other file. It names the release that comes next; the pull request
            # at the end of this run moves it on.
            number=$(python3 tools/release/version.py)
            version="${number}+${sha:0:7}"
            tag="v${number}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            # The button publishes main's head and the checkout above is of main, so this holds
            # unless main moved in the second between them.
            git fetch --quiet origin main
            git merge-base --is-ancestor "$sha" origin/main \
              || { echo "::error::$sha is not a commit of main"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME ${sha:0:7} -> $version" >> "$GITHUB_STEP_SUMMARY"

      # A release is signed or it is not a release. Only whether the secret is empty is tested;
      # its value is never printed, compared or written anywhere (keys/README.md).
      - name: And that there is a key to sign it with
        if: steps.commit.outputs.release == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set, so this release cannot be signed, so it is not a release. The key is made once, by a person: python spec/tools/manifestref.py keygen. The private half becomes this repository's RELEASE_SIGNING_KEY secret and exists nowhere else; the public half goes in keys/release.pub (keys/README.md)."
            exit 1
          fi
          echo "a signing key is present; its value is never printed"

      # The board environments of platformio.ini, so that adding a role or a board stays one
      # section of that file and no second list (phase 0's task 01, decision 2).
      - name: The board environments to build
        id: envs
        run: |
          set -euo pipefail
          envs=$(sed -n 's/^\[env:\([^]]*\)\]$/\1/p' platformio.ini | grep -vx native | jq -R . | jq -sc .)
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "the images: $envs"

      # The commit whose ci run stands for this one. Normally itself; but the pull request this
      # workflow files after a release leaves a commit on main that touches VERSION and
      # release-notes/ and nothing else, and that commit HAS NO CI RUN OF ITS OWN - GitHub starts
      # no workflow from a push or a pull request raised with the job's own token. The walk goes
      # back over exactly those commits to the newest one ci did run for, and stops at the first
      # commit that touched anything else (tools/release/gate.py).
      - name: The commit whose ci run stands for this one
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          evidence=$(python3 tools/release/gate.py evidence --sha "$SHA" --repository "$GITHUB_REPOSITORY")
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          if [ "$evidence" != "$SHA" ]; then
            echo "ci for ${SHA:0:7} is the run of ${evidence:0:7}: the commits between them are this workflow's own, and carry VERSION and release-notes/ alone" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # ci.yml runs on a push to main and on a pull request, once per commit, and never on a
      # branch push (phase 0's task 01): so a green run of either event for that commit is the
      # evidence, and a rehearsal on a branch has its pull request's run.
      - name: Wait for the ci workflow of that commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.evidence.outputs.evidence }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
                     --limit 20 --json status,conclusion,event,url)
            green=$(echo "$runs" | jq -r '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
            pending=$(echo "$runs" | jq -r '[.[] | select(.status != "completed")] | length')
            total=$(echo "$runs" | jq -r 'length')
            echo "ci for $SHA: $total run(s), $green green, $pending still running"
            if [ "$green" -gt 0 ]; then
              echo "$runs" | jq -r '.[] | select(.conclusion == "success") | "ci green: \(.url) (\(.event))"'
              exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "::error::ci has completed for $SHA without a green run. Nothing is released."
              echo "$runs" | jq -r '.[] | "  \(.event) \(.conclusion) \(.url)"'
              exit 1
            fi
            sleep 20
          done
          echo "::error::ci has not gone green for $SHA within 20 minutes. A commit ci has not passed is not released."
          exit 1

  build:
    name: build (${{ matrix.env }})
    needs: ci-green
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.ci-green.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-green.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PIO_VERSION }}-

      - name: Install PlatformIO Core
        run: pip install --quiet "platformio==${PIO_VERSION}"

      # The version is a build flag, so it is inside the image and not in a file beside it;
      # src/common/version/Version.cpp turns it into the string the firmware reports. tools/pio/buildinfo.py
      # writes it, the role, the board, the band, the MCU and the linker script of this build
      # into the build directory, and the publish job reads that rather than being told.
      - name: Build with the version baked in
        env:
          PLATFORMIO_BUILD_FLAGS: -D TWINOAK_FW_VERSION='"${{ needs.ci-green.outputs.version }}"'
        run: pio run -e ${{ matrix.env }}

      - name: What the publish job needs of this build
        run: |
          set -euo pipefail
          out="out/builds/${{ matrix.env }}"
          mkdir -p "$out"
          build=".pio/build/${{ matrix.env }}"
          cp "$build/buildinfo.json" "$build/ldscript.ld" \
             "$build/firmware.hex" "$build/firmware.zip" "$build/firmware.uf2" "$out/"
          cat "$out/buildinfo.json"
          test "$(jq -r .version "$out/buildinfo.json")" = "${{ needs.ci-green.outputs.version }}" \
            || { echo "::error::the build does not report the version this release is for"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.env }}
          path: out/builds/${{ matrix.env }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: ${{ needs.ci-green.outputs.release == 'true' && 'publish the release' || 'dry run (nothing published)' }}
    needs: [ci-green, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The pull request that moves the notes into the release's own file and the version on; main
      # requires one, and GitHub cannot give the Actions token a bypass of that rule.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-green.outputs.sha }}
          # A push out of a shallow clone is refused, and the step at the end of this job pushes
          # the branch the release's own pull request is made from.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install what the release tooling needs
        run: pip install --quiet -r tools/release/requirements.txt

      # No merge-multiple: each artifact lands in out/builds/build-<env>/, so the next step finds
      # the build directories without a second list of environments anywhere.
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: out/builds

      - name: The images, the manifest and SHA256SUMS
        env:
          VERSION: ${{ needs.ci-green.outputs.version }}
          SHA: ${{ needs.ci-green.outputs.sha }}
        run: |
          set -euo pipefail
          args=""
          for dir in out/builds/*/; do args="$args --build-dir ${dir%/}"; done
          echo "building a release from:$args"
          python tools/release/build_release.py --clean --out out/release --require-descriptor \
            --commit "$SHA" --version "$VERSION" $args
          ls -l out/release

      # The key is in the environment and nowhere else. A dry run never sees it: --test-key, and
      # sign_manifest.py refuses to sign a release version with that key.
      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE: ${{ needs.ci-green.outputs.release }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" = "true" ]; then
            python tools/release/sign_manifest.py --public-out out/public.hex out/release/manifest.json
          else
            python tools/release/sign_manifest.py --test-key --public-out out/public.hex out/release/manifest.json
          fi
          cat out/release/manifest.json.sig

      # Before anything is published: the signature just made passes against the public half,
      # with the specification's own verifier (spec/tools/manifestref.py).
      - name: Verify the signature before anything is published
        run: |
          set -euo pipefail
          python spec/tools/manifestref.py verify "$(cat out/public.hex)" out/release/manifest.json
          # And that SHA256SUMS is true of the files beside it: the names in it have no path.
          (cd out/release && sha256sum -c SHA256SUMS)

      # Two parts, in this order: the lines the tasks left and the standing paragraph under them,
      # which release_notes.py compiles out of the repository, and then what the manifest
      # generates. The top is the same bytes for a release and for a rehearsal of one, which is
      # what makes a rehearsal worth running; a rehearsal with nothing waiting says so in one line
      # where a release would have been refused in ci-green.
      - name: The release notes
        env:
          RELEASE: ${{ needs.ci-green.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$RELEASE" = "true" ]; then
            python tools/release/release_notes.py top > out/NOTES.md
          else
            python tools/release/release_notes.py top --rehearsal > out/NOTES.md
          fi
          python - <<'PY' >> out/NOTES.md
          import json, os
          m = json.load(open("out/release/manifest.json"))
          sig = open("out/release/manifest.json.sig").read().split()
          up = m["upstream"]
          release = os.environ["RELEASE"] == "true"
          v = "v" + m["version"].split("+")[0]
          print("TwinOak repeater firmware %s, built from `%s` on %s `%s` (`%s`)."
                % (v, m["commit"][:7], up["name"], up["tag"], up["commit"][:8]))
          print()
          print("The firmware reports `%s`, and the box link it speaks is %d.%d."
                % (m["version"], m["link"]["major"], m["link"]["minor"]))
          if not release:
              print()
              print("**This is a dry run.** The files are the workflow's artifact, nothing is "
                    "published, and the signature is the specification's public *test* key: "
                    "`%s`. A release is a person pressing *Run workflow* with *dry run* left "
                    "unticked." % sig[1])
          print()
          print("## What is in it")
          print()
          print("| File | For |")
          print("|---|---|")
          listed = set()   # the base is one file under several images: one row
          for image in m["images"]:
              for f in image["files"]:
                  if f["name"] in listed:
                      continue
                  listed.add(f["name"])
                  for_what = {
                      "swd": "**the Walter**, over SWD: the raw application binary, written at "
                             "`%s` and nowhere else" % f.get("load_address", ""),
                      "usb-dfu": "a laptop on the adapter's **USB-C** port: "
                                 "`adafruit-nrfutil dfu serial -pkg <file> -p <PORT> -b 115200`",
                      "usb-uf2": "a laptop on the **USB-C** port, the bootloader's drag-and-drop "
                                 "drive (double-tap reset, then copy the file onto it)",
                      "provision": "**the Walter, once per new radio** (`rak provision <radio> "
                                   "confirm`, a person's command): the base under the "
                                   "application - MBR, SoftDevice S140 6.1.1, bootloader - "
                                   "which no update ever writes (`spec/SYSTEM.md` S-5a, "
                                   "`spec/FIRMWARE-MANIFEST.md` section 4a; "
                                   "`boards/base/<family>/README.md` in the repository is its source, "
                                   "hash and licences)",
                  }.get(f["use"], "`use: %s` (spec/FIRMWARE-MANIFEST.md section 2)" % f["use"])
                  print("| `%s` | %s |" % (f["name"], for_what))
          print("| `manifest.json` | what each image is, for the Walter and for MeshMaster's "
                "catalogue (`spec/FIRMWARE-MANIFEST.md`) |")
          print("| `manifest.json.sig` | one Ed25519 line over the manifest's bytes, key id "
                "`%s` |" % sig[1])
          print("| `THIRD-PARTY-NOTICES` | the notices the base's licences ask for: Adafruit's "
                "bootloader and RAK's build of it (MIT), Nordic's SoftDevice (its own licence) |")
          print("| `SHA256SUMS` | every file above, the manifest included |")
          print()
          print("Because the manifest carries the SHA-256 of every file, that one signature "
                "covers the whole release. A file is identified by its hash, never by its name.")
          print()
          print("## An image is only ever written to the application region")
          print()
          for image in m["images"]:
              r = image.get("app_region")
              if r:
                  print("On `%s` (%s) that region is **`%s`..`%s`** - read from the linker script "
                        "this firmware was linked with, not typed in. Above it lies the file "
                        "system that holds the node's identity, its settings, the ACL and the "
                        "clock; below it the MBR, the SoftDevice. An update writes the "
                        "application region and nothing else: no chip erase, ever, and the "
                        "Walter refuses a manifest that asks for more "
                        "(`spec/SYSTEM.md` S-5, `docs/ARCHITECTURE.md` section 9)."
                        % (image["board"], image["id"], r["start"], r["end"]))
          print()
          print("## Flashing one")
          print()
          # The guide, at this tag, so the link is good for as long as the release is. A dry run
          # has no tag of its own: it points at the branch it rehearsed.
          ref = v if release else m["commit"][:7]
          print("[**docs/flashing.md**](https://github.com/%s/blob/%s/docs/flashing.md) is the "
                "page: which file is the repeater and which is the scanner, the `.uf2` and the "
                "`.zip` over the adapter's USB-C, the `.bin` through the Walter over SWD, the "
                "base `.hex` for a radio fresh from the factory, what to check afterwards, and "
                "the admin password nobody knows until somebody sets one. "
                "[docs/provisioning.md](https://github.com/%s/blob/%s/docs/provisioning.md) is "
                "what makes a board *this* unit, and "
                "[docs/release.md](https://github.com/%s/blob/%s/docs/release.md) is how a "
                "release is made."
                % (os.environ.get("GITHUB_REPOSITORY", "twinoak/twinoak.meshcore.repeater-firmware"),
                   ref,
                   os.environ.get("GITHUB_REPOSITORY", "twinoak/twinoak.meshcore.repeater-firmware"),
                   ref,
                   os.environ.get("GITHUB_REPOSITORY", "twinoak/twinoak.meshcore.repeater-firmware"),
                   ref))
          print()
          print("In short: the Walter does this by itself for a unit in the field, and a board "
                "on a bench takes the `.uf2` or the `.zip` over USB-C. Nothing has to be erased "
                "first.")
          PY
          cat out/NOTES.md
          cat out/NOTES.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # The tag is made here, on the commit that was built, and by nothing else: there is no tag
      # trigger, so it starts no run of this workflow.
      - name: Publish
        if: needs.ci-green.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ci-green.outputs.tag }}
          SHA: ${{ needs.ci-green.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --latest \
            --title "TwinOak repeater firmware $TAG" \
            --notes-file out/NOTES.md \
            out/release/*
          echo "published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # AFTER the release is out, and only then: the lines move out of release-notes/unreleased/
      # into release-notes/<tag>.md as published, and VERSION moves to the next patch. One commit,
      # touching those two and nothing else.
      #
      # BY A PULL REQUEST, not a push, and for meshmaster.dk's reason (its release.yml, *Commit
      # the release notes to master*): main requires a pull request before merging, and GitHub's
      # bypass lists take people, teams, roles and GitHub Apps - never the Actions token.
      #
      # THE RELEASE STANDS EITHER WAY. If the pull request cannot be merged - main asks for a
      # check that nothing will report on a pull request raised with the job's own token, or main
      # moved - it is left open, this job goes red, and the summary says what is waiting. Nothing
      # is undone: the release is published, and the next one is refused until VERSION has moved,
      # which is the refusal that makes this impossible to forget.
      - name: Move the lines into the release's notes, and the version on
        if: needs.ci-green.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ci-green.outputs.tag }}
        run: |
          set -euo pipefail
          python tools/release/release_notes.py move | tee -a "$GITHUB_STEP_SUMMARY"

          branch="release-notes/$TAG"
          title="Release notes: $TAG, and the version on"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- VERSION release-notes
          git commit -m "$title"

          cat > out/pr-body.md <<BODY
          The notes of **$TAG**, moved out of \`release-notes/unreleased/\` into
          \`release-notes/$TAG.md\` as published, and \`VERSION\` moved to the patch after it.
          The release is already out: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG

          Opened and merged by the publish job of \`.github/workflows/release.yml\`
          (\`tools/release/release_notes.py move\`): \`main\` requires a pull request before
          merging, and GitHub cannot give the Actions token a bypass.

          **No check runs on this pull request.** GitHub starts no workflow from an event raised
          with the job's own token. The change is \`VERSION\` and \`release-notes/\` alone, and
          the next release's *ci is green* gate walks back over exactly those commits to the run
          that stands for them (\`tools/release/gate.py\`).
          BODY

          # The commit sits on the detached HEAD this job checked out, and the push is what makes
          # the branch; --head then names it, because there is no local branch of that name.
          if ! git push origin "HEAD:refs/heads/$branch"; then
            printf '%s\n' \
              '### The release is out; its notes are still waiting for main' '' \
              "**$TAG is published and is not undone.** Only the branch \`$branch\`, which moves its lines into \`release-notes/$TAG.md\` and \`VERSION\` on, could not be pushed." '' \
              'Do it by hand: `python tools/release/release_notes.py move` on a branch off `main`, then a pull request. Until that lands the next release is refused, and the refusal says the same thing (`docs/release.md`, *When a release is refused*).' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
                  --title "$title" --body-file out/pr-body.md | tail -n 1) || url=""
          if [ -z "$url" ]; then
            printf '%s\n' \
              '### The release is out; its notes are still waiting for main' '' \
              "**$TAG is published and is not undone.** The branch \`$branch\` is on origin, but no pull request could be opened for it - *Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests* is the setting that lets the job do it." '' \
              "Open and merge a pull request from \`$branch\` by hand. Until it lands the next release is refused (\`docs/release.md\`, *When a release is refused*)." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$url"
          number="${url##*/}"

          # GitHub works out whether a pull request can be merged after it is opened, so a merge
          # asked for in the same second can be told it is not ready yet: three tries, ten seconds
          # apart, rather than one coin flip at the end of a release that is already out. And the
          # STATE decides, not gh's exit code, because gh also tidies the branch up afterwards and
          # this must not go red over that.
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
                 --subject "$title" --body ''; then merged=yes; break; fi
            if [ "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "MERGED" ]; then
              merged=yes; break
            fi
            echo "attempt $attempt to merge pull request $number did not take"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          if [ -z "$merged" ]; then
            printf '%s\n' \
              '### The release is out; its notes are still waiting for main' '' \
              "**$TAG is published and is not undone.** Only $url, which moves its lines into \`release-notes/$TAG.md\` and \`VERSION\` on, is still open." '' \
              "**Merge it.** It is the release's own two files and nothing else. \`main\` asks for the \`verify\` check, and nothing reports one on a pull request raised with the job's own token - so this one is merged by a person, or by a run of \`ci\` started by hand on its branch. Until it lands the next release is refused, and the refusal says the same thing (\`docs/release.md\`, *When a release is refused*)." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "the notes of $TAG went to main as $url, squashed from $branch" >> "$GITHUB_STEP_SUMMARY"

      - name: The dry run's output, for the record
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.ci-green.outputs.sha }}
          path: |
            out/release/*
            out/NOTES.md
          if-no-files-found: error
          retention-days: 14

# Every pull request and every push to main, once per commit.
#
# One step matters: pwsh tools/verify.ps1. It is the definition of "verified" in this repository
# (spec/SYSTEM.md S-10): the check of spec/ against its manifest, the link fixture, every board
# environment's build, the native tests and a dry run of the release over what was just built, in
# that order, with a log per step under out/verify/.
# A task is green on the machine it was written on before it is pushed; this run confirms it, and
# a red run after a green local one is a finding about the script (tasks/RUNBOOK.md section 4).
#
# One run per commit is twinoak/meshmaster.dk's rule and it is here from the first commit: a
# branch push and its pull request are two refs, so the concurrency group below cannot collapse
# them. A pull request is where a check blocks a merge, and a push to main is what the release
# workflow's ci-green waits for before a tag is released (phase 0's task 02 - which, because a
# branch push starts nothing here, lets a *rehearsal* on a branch stand on that branch's pull
# request run instead), so those two are the triggers and a branch push is not one.
#
# A red job blocks the merge: tasks/RUNBOOK.md merges on green only, and the branch protection
# of this repository makes GitHub insist too.
#
# IT RUNS AT HOME (tasks/phase-3.6/01-built-at-home.md). [self-hosted, unraid] is the
# organisation's own runners on Unraid, because GitHub-hosted minutes got out of hand;
# twinoak/meshmaster.dk moved the same way on 29 October 2026 and what it learned is in the steps
# below. Everything that CHECKS runs at home; everything that SHIPS - release.yml, all of it -
# stays on GitHub's runners, and the first step here is the guard that holds both halves of that
# rule (tools/ci/check-runners.ps1).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PlatformIO Core is pinned like every other dependency here (tasks/README.md): the version
  # the machine the tasks run on has, so the local run and this one are the same run.
  PIO_VERSION: "6.2.0"
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: verify
    # At home: this job checks, it does not ship. tools/ci/check-runners.ps1 below is what holds
    # it here, and release.yml on GitHub's runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The rule about where each workflow runs, over every job of .github/workflows/, before any
      # of the work: a job in the wrong place is a finding, not something to discover at a tag.
      # pwsh is on the runners (meshmaster.dk's CI uses it there) and on GitHub's images.
      - name: Every job is where it belongs
        shell: pwsh
        run: ./tools/ci/check-runners.ps1

      # A self-hosted runner keeps its workspace from one job to the next, and the branch that
      # ran here last was somebody else's task. actions/checkout runs `git clean -ffdx`, which
      # takes the ignored directories with it - .pio/ (PlatformIO's build output and the
      # dependencies it clones, MeshCore among them, at that branch's pin) and out/. This is the
      # proof rather than the hope. And it is the whole of what this job writes outside its own
      # workspace and the runner's home, which is ~/.platformio and ~/.cache/pip and nothing
      # else: no step here opens a port on the host or starts anything that outlives the job.
      - name: Nothing of the last job is left in the workspace
        shell: bash
        run: |
          set -euo pipefail
          left=""
          for path in .pio out; do
            if [ -e "$path" ]; then left="$left $path"; fi
          done
          if [ -n "$left" ]; then
            echo "::error::checkout left$left behind; this job would build on another branch's leftovers"
            exit 1
          fi
          echo "the workspace is this checkout and nothing else"

      # What this job calls that a runner may not have. GitHub's image carries all of it; the
      # Unraid runner's is thinner, and g++ is the one that decides where work happens:
      # tools/verify.ps1 runs the native tests and the link loop with the host compiler when
      # there is one and in a python:3.11-slim container when there is not - and a container
      # started from inside the runner's own container would bind-mount a path the daemon's host
      # does not have. So the compiler is installed here and that step stays on the host, as it
      # does on GitHub's runners.
      #
      # `zip` is deliberately not in this list: no job of this repository calls it. The DFU .zip
      # is written by adafruit-nrfutil (Python, from ~/.platformio) and the run's artifact by
      # upload-artifact (Node). pwsh is not installed here either - it is a package feed rather
      # than a package - so a runner without it fails here, naming itself, instead of failing
      # inside the one step that matters. Python is actions/setup-python's, below.
      - name: What this job needs that the runner may not have
        shell: bash
        run: |
          set -euo pipefail
          needed="g++ git curl tar"
          missing=""
          for tool in $needed; do
            if ! command -v "$tool" >/dev/null 2>&1; then missing="$missing $tool"; fi
          done
          if [ -n "$missing" ]; then
            command -v apt-get >/dev/null 2>&1 \
              || { echo "::error::this runner is missing$missing and has no apt-get to install it with"; exit 1; }
            sudo=""
            if [ "$(id -u)" != "0" ]; then sudo="sudo"; fi
            echo "installing:$missing"
            $sudo apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $sudo apt-get install -y -qq $missing
          fi
          for tool in $needed bash pwsh; do
            command -v "$tool" >/dev/null 2>&1 \
              || { echo "::error::$tool is not on this runner and this job cannot do without it"; exit 1; }
          done
          {
            echo "### The runner"
            echo
            echo "\`${RUNNER_NAME:-?}\` (\`${RUNNER_ENVIRONMENT:-?}\`, ${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
            echo
            echo '```'
            for tool in $needed bash pwsh; do printf '%-6s %s\n' "$tool" "$(command -v "$tool")"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The platform, the toolchain and every library, keyed by the file that decides them: a hit
      # turns a cold build of minutes into seconds. MeshCore is a git dependency, so the pin is
      # in the key through platformio.ini.
      #
      # ON GITHUB'S RUNNERS ONLY (meshmaster.dk's 70b73ad). A self-hosted runner keeps its home
      # between jobs, so ~/.platformio and ~/.cache/pip are already there - and the tarball would
      # come over the WAN every job for nothing.
      - name: Cache PlatformIO
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'tools/release/requirements.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PIO_VERSION }}-

      # The release step of tools/verify.ps1 needs cryptography (Ed25519 for the manifest's
      # signature), pinned in tools/release/requirements.txt. Installed into this runner's own
      # Python, which is the one PlatformIO runs on, so the script takes its host path here; on a
      # Windows box with no cryptography it uses the container instead.
      - name: Install PlatformIO Core and what the release tooling needs
        run: pip install --quiet "platformio==${PIO_VERSION}" -r tools/release/requirements.txt

      # The one step that matters. g++ is the runner's own - the step above made sure of it - so
      # the native tests and the link loop run on the host here; on a Windows box the script runs
      # them in a container instead.
      - name: Verify
        run: pwsh -File tools/verify.ps1

      # The size of what was built, for the record; -Werror on src/ has already failed the step
      # above if a warning of ours was in it.
      - name: What was built
        if: always()
        run: |
          set -euo pipefail
          for log in out/verify/build-*.log; do
            [ -f "$log" ] || continue
            {
              echo "### $(basename "$log" .log | sed 's/^build-//')"
              echo '```'
              grep -E '^(RAM|Flash):' "$log" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # The images (the .hex the Walter flashes over SWD, the DFU .zip for a laptop, the .uf2 for
      # the bootloader's drive, the .elf), the dry run of the release the verify script makes, and
      # every step's log.
      - name: Keep the images and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            out/build/
            out/release/
            out/verify/
          if-no-files-found: error
          retention-days: 14

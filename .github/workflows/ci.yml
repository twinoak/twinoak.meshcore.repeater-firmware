# Every pull request and every push to main, once per commit.
#
# One step matters: pwsh tools/verify.ps1. It is the definition of "verified" in this repository
# (spec/SYSTEM.md S-10): the check of spec/ against its manifest, the link fixture, every board
# environment's build, the native tests and a dry run of the release over what was just built, in
# that order, with a log per step under out/verify/.
# A task is green on the machine it was written on before it is pushed; this run confirms it, and
# a red run after a green local one is a finding about the script (tasks/RUNBOOK.md section 4).
#
# One run per commit is twinoak/meshmaster.dk's rule and it is here from the first commit: a
# branch push and its pull request are two refs, so the concurrency group below cannot collapse
# them. A pull request is where a check blocks a merge, and a push to main is what the release
# workflow's ci-green waits for before a tag is released (phase 0's task 02 - which, because a
# branch push starts nothing here, lets a *rehearsal* on a branch stand on that branch's pull
# request run instead), so those two are the triggers and a branch push is not one.
#
# A red job blocks the merge: tasks/RUNBOOK.md merges on green only, and the branch protection
# of this repository makes GitHub insist too.
#
# WHERE THIS RUNS. On GitHub's runners (ubuntu-latest), like every job of every workflow here, for
# two reasons that both come of the same fact: **this repository is public**, since 13 November
# 2026. Actions on standard GitHub-hosted runners are free in a public repository, so this file
# spends no credit - the minutes that got out of hand in October are the private repositories',
# meshmaster.dk's among them, and theirs is the CI that runs at home on the organisation's Unraid
# runners. And a public repository is the one place a self-hosted runner must not be: a fork can
# open a pull request that changes this file, and it would then run on the Unraid host, with its
# docker socket, its LAN and its Tailscale. GitHub's own guidance is that self-hosted runners
# "should almost never be used for public repositories". From 13 November, when that group stopped
# offering its runners here, until this file moved, no run of it was given a runner at all
# (tasks/phase-3.12/03-ci-where-a-public-repository-may-run.md). README's *Where CI runs* is the
# page, the guard below is what holds it, and tasks/phase-3.6/01-built-at-home.md with commit
# 4cb2200 is the way home again if this repository is ever made private.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PlatformIO Core is pinned like every other dependency here (tasks/README.md): the version
  # the machine the tasks run on has, so the local run and this one are the same run.
  PIO_VERSION: "6.2.0"
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: verify
    # On GitHub's own machine, like every job here: tools/ci/check-runners.ps1 below is the rule
    # and this is the step that runs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The rule about where each workflow runs, over every job of .github/workflows/, before any
      # of the work: a job in the wrong place is a finding, not something to discover at a tag -
      # or, as happened on 13 November, a queue nobody is told about. The self-test first, which
      # is the shapes the rule must refuse (-SelfTest then runs the real check too). pwsh is on
      # GitHub's images.
      - name: Every job runs where it must
        shell: pwsh
        run: ./tools/ci/check-runners.ps1 -SelfTest

      # What this job calls, and which machine it is on - a check and a note, not an install.
      #
      # When this job ran at home, the step here installed g++ and friends when the Unraid image
      # did not have them, and a step before it proved that checkout's `git clean -ffdx` had taken
      # the last branch's .pio/ and out/ with it. Neither earns its place on a GitHub-hosted
      # runner: the workspace is a machine that did not exist a minute ago, so there is nothing of
      # another branch to find, and actions/runner-images carries all five of these tools. The
      # check is what is kept, because g++ is the one that decides where the work happens -
      # tools/verify.ps1 runs the native tests and the link loop with the host compiler when there
      # is one and in a python:3.11-slim container when there is not, and the container is fifteen
      # minutes rather than two. If GitHub's image ever drops it, this step says so by name
      # instead of the run going slow and quiet.
      #
      # `zip` is deliberately not in this list: no job of this repository calls it. The DFU .zip is
      # written by adafruit-nrfutil (Python, from ~/.platformio) and the run's artifact by
      # upload-artifact (Node). Python is actions/setup-python's, below.
      - name: What this job needs, and the machine it is on
        shell: bash
        run: |
          set -euo pipefail
          for tool in g++ git curl tar bash pwsh; do
            command -v "$tool" >/dev/null 2>&1 \
              || { echo "::error::$tool is not on this runner and this job cannot do without it"; exit 1; }
          done
          {
            echo "### The runner"
            echo
            echo "\`${RUNNER_NAME:-?}\` (\`${RUNNER_ENVIRONMENT:-?}\`, ${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
            echo
            echo '```'
            for tool in g++ git curl tar bash pwsh; do printf '%-6s %s\n' "$tool" "$(command -v "$tool")"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The platform, the toolchain and every library, keyed by the file that decides them: a hit
      # turns a cold build of minutes into seconds. MeshCore is a git dependency, so the pin is
      # in the key through platformio.ini.
      #
      # It runs on every job again. While this job was at home it was `if: runner.environment ==
      # 'github-hosted'` (meshmaster.dk's 70b73ad): a self-hosted runner keeps its home between
      # jobs, so ~/.platformio and ~/.cache/pip were already there and the tarball would have come
      # over the WAN for nothing. A GitHub-hosted runner has nothing on disk, so the cache is the
      # difference between a cold build and a warm one.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'tools/release/requirements.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PIO_VERSION }}-

      # The release step of tools/verify.ps1 needs cryptography (Ed25519 for the manifest's
      # signature), pinned in tools/release/requirements.txt. Installed into this runner's own
      # Python, which is the one PlatformIO runs on, so the script takes its host path here; on a
      # Windows box with no cryptography it uses the container instead.
      - name: Install PlatformIO Core and what the release tooling needs
        run: pip install --quiet "platformio==${PIO_VERSION}" -r tools/release/requirements.txt

      # The one step that matters. g++ is the runner's own - the step above made sure of it - so
      # the native tests and the link loop run on the host here; on a Windows box the script runs
      # them in a container instead.
      - name: Verify
        run: pwsh -File tools/verify.ps1

      # The size of what was built, for the record; -Werror on src/ has already failed the step
      # above if a warning of ours was in it.
      - name: What was built
        if: always()
        run: |
          set -euo pipefail
          for log in out/verify/build-*.log; do
            [ -f "$log" ] || continue
            {
              echo "### $(basename "$log" .log | sed 's/^build-//')"
              echo '```'
              grep -E '^(RAM|Flash):' "$log" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # The images (the .hex the Walter flashes over SWD, the DFU .zip for a laptop, the .uf2 for
      # the bootloader's drive, the .elf), the dry run of the release the verify script makes, and
      # every step's log.
      - name: Keep the images and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            out/build/
            out/release/
            out/verify/
          if-no-files-found: error
          retention-days: 14

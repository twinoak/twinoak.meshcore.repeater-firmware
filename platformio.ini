; TwinOak repeater firmware - PlatformIO project configuration.
;
; MeshCore is a LIBRARY here, pinned at one commit (spec/SYSTEM.md S-2): nothing of upstream's
; tree is edited, its simple_repeater example is compiled from the pin, and keeping up with
; MeshCore is the two lines of [meshcore] below (docs/upstream.md, which is also what a weekly
; workflow moves them with). The shape is twinoak/meshmaster-agent-firmware's, which did the same
; for ESP32.
;
; The flag blocks of the board environment below are MeshCore's own, copied from its root
; platformio.ini ([arduino_base], [nrf52_base], [sensor_base]) and from
; variants/rak4631/platformio.ini ([rak4631], [env:RAK_4631_repeater]) at the pin. Those sections
; use paths relative to MeshCore's root and cannot be included from a consumer's project, so a
; pin bump has to re-read them. The one file of upstream's that is copied into this repository is
; boards/rak4631.json, and boards/README.md says why.
;
;   pio run -e repeater_rak4630_single   the repeater for the single-RAK adapter
;   pio test -e native                    the tests that need no board
;   tools/verify.ps1                      everything CI runs (tasks/README.md)
;
; An environment is <role>_<board> (docs/ARCHITECTURE.md section 8). tools/verify.ps1 reads the
; board environments from this file: every [env:*] but native is built.

[meshcore]
; The two lines that say which MeshCore this is. .github/workflows/upstream.yml rewrites exactly
; these two when it opens a bump, and docs/upstream.md's pin history says when each tag was
; adopted and why - so nothing around them restates a version that a bump would leave behind.
pin = d92964352441e53b93e8667b802e04f6e072b39e
tag = repeater-v1.17.1
url = https://github.com/meshcore-dev/MeshCore.git
; Where PlatformIO puts it, for the -I flags the variant, the example and lib/ed25519 need, and
; for the scripts under tools/pio/ that reach into it.
dir = $PROJECT_LIBDEPS_DIR/$PIOENV/MeshCore

[libs]
; Versions are exact, not ranges: a firmware build has to be reproducible, and MeshCore's own
; ranges (its library.json and platformio.ini) would float under us between two builds of the
; same commit. The list starts from the agent firmware's resolved list at the same pin, plus what
; an nRF52 build needs ([nrf52_base]: CustomLFS; the Adafruit core fork is a platform package,
; see [nrf52_base] below). A pin bump re-resolves them.
;
;   RadioLib          the SX1262 driver. MeshCore's platformio.ini pins a git commit
;                     (6d89348, "7.7.1+sha") that is not a registry release; installing it beside
;                     MeshCore's own library.json dependency "^7.6.0" gives two libraries for one
;                     RadioLib.h, so this is the registry release that satisfies that range
;                     instead - the agent firmware's choice, and the one thing here that is not
;                     byte-for-byte MeshCore's. A line for every bump to re-read.
;   Crypto            Ed25519 and SHA-256 for MeshCore's identities and packets
;   RTClib, RV3028    MeshCore's clock helpers (compiled whether a board has an RTC or not)
;   CayenneLPP        the telemetry encoding of MeshCore's sensor helpers
;   BusIO, ArduinoJson
;                     transitive, declared because upstream asks for them with "*"
;   CustomLFS         [nrf52_base]'s file system (EXTRAFS=1), a git tag - already exact
;   Adafruit/*, INA*, SHT*, LPS22HB, MicroNMEA, VL53L0X
;                     MeshCore's src/helpers/sensors, which build_as_lib.py compiles into every
;                     build whether a sensor is fitted or not - so they are not optional here
core =
  SPI
  Wire
  jgromes/RadioLib @ 7.8.0
  rweather/Crypto @ 0.4.0
  adafruit/RTClib @ 2.1.4
  adafruit/Adafruit BusIO @ 1.17.4
  melopero/Melopero RV3028 @ 1.2.0
  electroniccats/CayenneLPP @ 1.6.1
  bblanchon/ArduinoJson @ 7.4.3
nrf52 =
  https://github.com/oltaco/CustomLFS#0.2.3
sensors =
  adafruit/Adafruit INA3221 Library @ 1.0.1
  adafruit/Adafruit INA219 @ 1.2.3
  robtillaart/INA226 @ 0.6.6
  adafruit/Adafruit INA260 Library @ 1.5.3
  adafruit/Adafruit AHTX0 @ 2.0.6
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit BMP280 Library @ 2.6.8
  adafruit/Adafruit SHTC3 Library @ 1.0.2
  sensirion/Sensirion I2C SHT4x @ 1.1.2
  arduino-libraries/Arduino_LPS22HB @ 1.0.3
  adafruit/Adafruit MLX90614 Library @ 2.1.6
  adafruit/Adafruit_VL53L0X @ 1.2.5
  stevemarple/MicroNMEA @ 2.0.6
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit BMP085 Library @ 1.2.4

[platformio]
default_envs = repeater_rak4630_single

; ----------------------------------------------------------------------------------------------
; MeshCore's [arduino_base] and [nrf52_base], as a library consumer sees them
; ----------------------------------------------------------------------------------------------

; MeshCore's root platformio.ini, [arduino_base] and [nrf52_base] at the pin, composed. Three of
; upstream's flags are deliberately absent:
;   -w                      inhibits every warning, and GCC's -w wins over a later -Wall whatever
;                           the order - with it the -Werror of build_src_flags would say nothing
;                           (the agent firmware's bootstrap report found that). Without it the
;                           whole build, upstream included, prints some warning lines; that is
;                           the price of a strict build of our own sources.
;   ENABLE_PRIVATE_KEY_IMPORT, ENABLE_PRIVATE_KEY_EXPORT
;                           upstream's own comment says to remove them for a more secure
;                           firmware; a unit's identity is generated on it and never leaves it.
; MESH_PACKET_LOGGING and MESH_DEBUG are never enabled, in any environment: nothing the mesh says
; is logged as text (spec/SYSTEM.md S-12).
[nrf52_base]
framework = arduino
; Pinned, as every other dependency here is: the toolchain the platform resolves is part of the
; build. Upstream says `nordicnrf52` with no version; this is the newest release on the day the
; first build was made, and a bump of it is a deliberate line in a pull request.
platform = platformio/nordicnrf52@11.0.0
platform_packages =
  ; MeshCore's own fork of the Adafruit nRF52 core, at the commit upstream pins ([nrf52_base]:
  ; a patch to the BLE stack against lockups during rapid connect/disconnect). NoiseScope in the
  ; hardware repository is pinned to the same commit, so the two firmwares a repeater swaps
  ; between run the same core.
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
monitor_speed = 115200
build_flags =
  -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
  ; Not upstream's: the Adafruit core's Uart holds SERIAL_BUFFER_SIZE bytes of receive ring and
  ; the same of transmit buffer, and its default of 64 (cores/nRF5/RingBuffer.h, #ifndef-guarded)
  ; is neither enough for one 246-byte frame of the box link nor enough to write one without
  ; blocking (cores/nRF5/Uart.cpp copies at most SERIAL_BUFFER_SIZE bytes per write). 256 holds a
  ; whole frame either way (src/link/SerialTransport.h says the rest). The define is the core's
  ; only lever and it is global, so it costs 1536 bytes of RAM in four places that are not
  ; Serial1: Serial2, which the core instantiates beside it, and the two RingBuffers of each of
  ; Wire and Wire1 (libraries/Wire/Wire.h). Roomier I2C buffers harm nothing; the figure is in
  ; tasks/phase-1/reports/03.md with the rest of the link's RAM.
  -D SERIAL_BUFFER_SIZE=256
; build_src_flags reaches src/ only: a warning in a file of ours is a red build, and upstream's
; warnings are not ours to fix - including the ones the compiler meets in upstream's headers while
; it compiles a file of ours, which src/board/UpstreamHeaders.h keeps out of -Werror by including
; them as system headers. -Wno-error=cpp is for the one thing that does not silence, a #warning
; directive (RadioLib's about RADIOLIB_GODMODE): it stays a warning, as in the agent firmware.
build_src_flags = -Wall -Wextra -Werror -Wno-error=cpp
; Our exact versions come first and MeshCore after them: PlatformIO installs lib_deps in order and
; resolves a dependency's own ranges against what is already installed, so the RadioLib it finds
; for MeshCore's "^7.6.0" is the 7.8.0 above. The other way round, MeshCore's range fetched the
; newest release into a second directory (RadioLib@7.8.1 beside RadioLib) - unused by the build,
; but a copy nobody asked for.
lib_deps =
  ${libs.core}
  ${libs.nrf52}
  ${meshcore.url}#${meshcore.pin}

; ----------------------------------------------------------------------------------------------
; The boards
; ----------------------------------------------------------------------------------------------

; The repeater role on the single-RAK adapter (RAK4630 stamp: nRF52840 + SX1262). Upstream's
; simple_repeater example from the pin - MyMesh.{h,cpp}, byte for byte - under our application:
; src/main.cpp constructs a TwinOakMesh (src/app/, a subclass of MyMesh) and src/board/target.cpp
; is the board target (docs/ARCHITECTURE.md sections 2 and 3; phase 1's task 01 is the proof).
;
; The flags are MeshCore's variants/rak4631/platformio.ini [rak4631] and [env:RAK_4631_repeater]
; plus its root [sensor_base], at the pin. Two defines tell upstream's build_as_lib.py which of
; MeshCore's own sources to compile, and one is deliberately absent:
;   BUILD_EXAMPLE         examples/simple_repeater/*.cpp (MyMesh.cpp, UITask.cpp - and main.cpp,
;                         but for the next line)
;   EXCLUDE_FROM_EXAMPLE  leaves main.cpp of the example out: ours is src/main.cpp. build_as_lib.py
;                         reads the defines in order and this one must follow BUILD_EXAMPLE.
;                         UITask.cpp is still compiled; without DISPLAY_CLASS nothing references
;                         it and the linker leaves it out.
;   (no MC_VARIANT)       with it, build_as_lib.py would compile all of variants/rak4631/ - its
;                         target.cpp included, which is the file src/board/target.cpp replaces.
;                         The two variant files still upstream's, RAK4631Board.cpp and the Arduino
;                         variant.cpp, are compiled out of the pinned checkout by
;                         tools/pio/meshcore_variant.py instead (the Adafruit core at this pin has
;                         no WisCore_RAK4631_Board variant of its own, so variant.cpp has to come
;                         from MeshCore's tree - as it does in upstream's build).
; The include order matters for one file: upstream's MyMesh.h does `#include <target.h>`, so
; src/board comes first on the path and variants/rak4631 (still needed for variant.h's LoRa pins
; and RAK4631Board.h) after it.
;
; Left out of upstream's blocks, on purpose:
;   DISPLAY_CLASS         there is no display on the adapter; without the define upstream's
;                         UITask and our target build no UI
;   ENV_INCLUDE_GPS, PIN_GPS_RX/TX/EN
;                         Serial1 is the link to the Walter on our adapter, not a GPS; upstream's
;                         own RS232-bridge environments leave the GPS out the same way (they
;                         -UENV_INCLUDE_GPS). This also drops the SparkFun u-blox GNSS library
;                         the RAK GPS path needs.
;   ENV_INCLUDE_BME680_BSEC, -UENV_INCLUDE_BME680, fix_bsec_lib.py
;                         Bosch's BSEC is a binary blob whose packaging needs upstream's
;                         post-script to link; the unit has a BME280, not a BME680. The sensor
;                         manager is compiled with the open Adafruit BME680 driver instead, as
;                         [sensor_base] has it and as the agent firmware does.
;   ENV_INCLUDE_RAK12035  the WisBlock soil-moisture sensor, not fitted; its driver still
;                         compiles (helpers/sensors is unconditional in build_as_lib.py)
;   ENV_INCLUDE_INA3221   upstream's INA3221 support applies one shunt value to all three
;                         channels and ours are 100, 20 and 50 milliohm (docs/ARCHITECTURE.md
;                         section 3); task 06 reads the INA3221 itself. The library still
;                         compiles, unused, because helpers/sensors is unconditional.
;   Adafruit SSD1306, SparkFun u-blox GNSS, BSEC
;                         the libraries of the three things above
;   MESH_PACKET_LOGGING, MESH_DEBUG
;                         never (spec/SYSTEM.md S-12); test/test_rails reads this file for them
; ADMIN_PASSWORD is defined - upstream's constructor needs a value, and without the define its
; MyMesh.cpp defaults to the word every stock repeater ships with - as a string nobody is meant to
; use: on a boot that finds no saved preferences src/app/FirstBoot.cpp overwrites it with a random
; one before loop() ever runs, and from then on the saved one is loaded over it (spec/SYSTEM.md
; S-13). test/test_rails fails a board environment that leaves it out or sets it to upstream's
; word.
; The Danish channel is the build default: 869.618 MHz, 62.5 kHz, SF8, CR8, +22 dBm (MeshCore
; Denmark, EU Narrow). LORA_FREQ/BW/SF come from [nrf52_base] above; CR and TX power are here.
;
; The two TWINOAK_MESHCORE_* defines carry the pin into the firmware string src/app/Version.cpp
; builds, so a bump moves them with the pin and never by hand. TWINOAK_FW_VERSION is given by
; the release build (.github/workflows/release.yml); without it the string says 0.0.0-dev.
;
; TWINOAK_ROLE, TWINOAK_BOARD and TWINOAK_BAND are the three strings that identify an image -
; the manifest's role, board and band and the image descriptor's (spec/FIRMWARE-MANIFEST.md
; sections 2 and 4), so they are spelled as that document spells them: the board is
; "rak4630-single" and not the environment's own "rak4630_single". tools/pio/buildinfo.py writes
; them, the MCU and the linker script of the build into $BUILD_DIR/buildinfo.json, which is what
; the release tooling reads instead of being told.
[env:repeater_rak4630_single]
extends = nrf52_base
; boards/rak4631.json, vendored from the pin: PlatformIO reads boards_dir before it clones a
; dependency (boards/README.md). The RAK4630 stamp is the RAK4631 core module, same pin map.
board = rak4631
extra_scripts =
  pre:tools/pio/meshcore_private_libs.py
  post:tools/pio/meshcore_uf2.py
  post:tools/pio/meshcore_variant.py
  post:tools/pio/buildinfo.py
  post:tools/pio/linkmap.py
build_flags =
  ${nrf52_base.build_flags}
  -I $PROJECT_DIR/src/board
  -I ${meshcore.dir}/variants/rak4631
  -I ${meshcore.dir}/examples/simple_repeater
  -I ${meshcore.dir}/lib/ed25519
  -D BUILD_EXAMPLE=simple_repeater
  -D EXCLUDE_FROM_EXAMPLE=main.cpp
  -D ADMIN_PASSWORD='"not-a-password"'
  -D TWINOAK_MESHCORE_TAG='"${meshcore.tag}"'
  -D TWINOAK_MESHCORE_PIN='"${meshcore.pin}"'
  -D TWINOAK_BOARD='"rak4630-single"'
  -D TWINOAK_ROLE='"repeater"'
  ; 869.618 MHz is the 868 band; a 433 build of this board would be a second environment.
  -D TWINOAK_BAND='"868"'
  -D RAK_4631
  -D RAK_BOARD
  -D NRF52_POWER_MANAGEMENT
  -D PIN_BOARD_SCL=14
  -D PIN_BOARD_SDA=13
  -D PIN_OLED_RESET=-1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_CR=8
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ADVERT_NAME='"RAK4631 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D MAX_NEIGHBOURS=50
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  ${nrf52_base.lib_deps}
  ${libs.sensors}

; ----------------------------------------------------------------------------------------------
; The tests that need no board
; ----------------------------------------------------------------------------------------------

; A host build: no Arduino, no MeshCore, no radio. The host-portable files of src/ are compiled
; beside the tests (test_build_src), and only those: the filter starts empty and lists them one
; by one, because everything else in src/ needs a board. The TWINOAK_MESHCORE_* defines are the
; board build's own, so that src/app/Version.cpp says the same thing here as it does on the board.
; PROJECT_DIR is for test/test_rails, which reads this file and walks src/; FIXTURES_DIR is how
; test/test_link_codec and test/test_link_session find spec/fixtures/link without assuming the
; working directory pio test runs it from, as the agent firmware's native environment does it.
; The board's C++ standard is the Adafruit nRF52 core's gnu++11 (the platform's
; builder/frameworks/arduino/adafruit.py), so everything under src/link/ is written to C++11 and
; compiled here as C++17 - the tests themselves are the only C++17 in this repository.
; On Windows this environment runs in a container (tasks/RUNBOOK.md section 2; tools/verify.ps1
; does that by itself).
[env:native]
platform = native
test_framework = googletest
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -D TWINOAK_MESHCORE_TAG='"${meshcore.tag}"'
  -D TWINOAK_MESHCORE_PIN='"${meshcore.pin}"'
  -D PROJECT_DIR='"$PROJECT_DIR"'
  -D FIXTURES_DIR='"$PROJECT_DIR/spec/fixtures/link"'
build_src_filter =
  -<*>
  +<app/Version.cpp>
  +<app/AdminPassword.cpp>
  +<clock/ClockKeeper.cpp>
  +<link/codec/Bytes.cpp>
  +<link/codec/Cobs.cpp>
  +<link/codec/Crc16.cpp>
  +<link/codec/FrameReceiver.cpp>
  +<link/codec/FrameWriter.cpp>
  +<link/codec/Messages.cpp>
  +<link/codec/Packet.cpp>
  +<link/session/ResetReason.cpp>
  +<link/session/Session.cpp>
; ArduinoJson is already one of [libs].core above, at the same exact version: here it is the
; fixture reader of test/test_link_codec, which reads spec/fixtures/link/link-v1.json at run time
; (the agent firmware's test_config_read does the same with the same library).
lib_deps =
  google/googletest @ 1.17.0
  bblanchon/ArduinoJson @ 7.4.3

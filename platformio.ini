; TwinOak repeater firmware - PlatformIO project configuration.
;
; MeshCore is a LIBRARY here, pinned at one commit (spec/SYSTEM.md S-2): nothing of upstream's
; tree is edited, its simple_repeater example is compiled from the pin, and keeping up with
; MeshCore is the two lines of [meshcore] below (docs/upstream.md, which is also what a weekly
; workflow moves them with). The shape is twinoak/meshmaster-agent-firmware's, which did the same
; for ESP32.
;
; The flag blocks of the board environment below are MeshCore's own, copied from its root
; platformio.ini ([arduino_base], [nrf52_base], [sensor_base]) and from
; variants/rak4631/platformio.ini ([rak4631], [env:RAK_4631_repeater]) at the pin. Those sections
; use paths relative to MeshCore's root and cannot be included from a consumer's project, so a
; pin bump has to re-read them. The one file of upstream's that is copied into this repository is
; boards/rak4631.json, and boards/README.md says why.
;
;   pio run -e repeater_rak4630_single   the repeater for the single-RAK adapter
;   pio test -e native                    the tests that need no board
;   tools/verify.ps1                      everything CI runs (tasks/README.md)
;
; An environment is <role>_<board> (docs/ARCHITECTURE.md section 8). tools/verify.ps1 reads the
; board environments from this file: every [env:*] but native is built.

[meshcore]
; The two lines that say which MeshCore this is. .github/workflows/upstream.yml rewrites exactly
; these two when it opens a bump, and docs/upstream.md's pin history says when each tag was
; adopted and why - so nothing around them restates a version that a bump would leave behind.
pin = 81dbae592ffad40b4212bc0b37e82b38da08f4bc
tag = repeater-v1.18.0
url = https://github.com/meshcore-dev/MeshCore.git
; Where PlatformIO puts it, for the -I flags the variant, the example and lib/ed25519 need, and
; for the scripts under tools/pio/ that reach into it.
dir = $PROJECT_LIBDEPS_DIR/$PIOENV/MeshCore

[libs]
; Versions are exact, not ranges: a firmware build has to be reproducible, and MeshCore's own
; ranges (its library.json and platformio.ini) would float under us between two builds of the
; same commit. The list starts from the agent firmware's resolved list at the same pin, plus what
; an nRF52 build needs ([nrf52_base]: CustomLFS; the Adafruit core fork is a platform package,
; see [nrf52_base] below). A pin bump re-resolves them.
;
;   RadioLib          the SX1262 driver. MeshCore's platformio.ini pins a git commit
;                     (6d89348, "7.7.1+sha") that is not a registry release; installing it beside
;                     MeshCore's own library.json dependency "^7.6.0" gives two libraries for one
;                     RadioLib.h, so this is the registry release that satisfies that range
;                     instead - the agent firmware's choice, and the one thing here that is not
;                     byte-for-byte MeshCore's. A line for every bump to re-read.
;   Crypto            Ed25519 and SHA-256 for MeshCore's identities and packets
;   RTClib, RV3028    MeshCore's clock helpers (compiled whether a board has an RTC or not)
;   CayenneLPP        the telemetry encoding of MeshCore's sensor helpers
;   BusIO, ArduinoJson
;                     transitive, declared because upstream asks for them with "*"
;   CustomLFS         [nrf52_base]'s file system (EXTRAFS=1), a git tag - already exact
;   Adafruit/*, INA*, SHT*, LPS22HB, MicroNMEA, VL53L0X
;                     MeshCore's src/helpers/sensors, which build_as_lib.py compiles into every
;                     build whether a sensor is fitted or not - so they are not optional here
; RadioLib is one line of its own because both images of a board take it from there: the two
; firmwares a repeater swaps between must contain the same radio driver or a reading of one is
; not comparable with what the other hears.
radiolib = jgromes/RadioLib @ 7.8.0
core =
  SPI
  Wire
  ${libs.radiolib}
  rweather/Crypto @ 0.4.0
  adafruit/RTClib @ 2.1.4
  adafruit/Adafruit BusIO @ 1.17.4
  melopero/Melopero RV3028 @ 1.2.0
  electroniccats/CayenneLPP @ 1.6.1
  bblanchon/ArduinoJson @ 7.4.3
; What the scanner needs and nothing more: it compiles no MeshCore, so it has no identity, no
; file system and no sensor manager - the SX1262 driver, SPI and Wire are the whole list
; (src/roles/scanner/). RadioLib is the same exact version the repeater's image contains, which
; is what makes the two comparable on one radio: NoiseScope pinned the commit MeshCore pins
; ("7.7.1+sha"), and the repeater here cannot use that commit (the RadioLib note above), so
; pinning it in the scanner would make the scanner the odd one out - tasks/phase-3/reports/02.md
; says it at length. PlatformIO installs lib_deps per environment
; (.pio/libdeps/<env>/), so neither environment's list can reach the other's build.
scanner =
  SPI
  Wire
  ${libs.radiolib}
nrf52 =
  https://github.com/oltaco/CustomLFS#0.2.3
sensors =
  adafruit/Adafruit INA3221 Library @ 1.0.1
  adafruit/Adafruit INA219 @ 1.2.3
  robtillaart/INA226 @ 0.6.6
  adafruit/Adafruit INA260 Library @ 1.5.3
  adafruit/Adafruit AHTX0 @ 2.0.6
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit BMP280 Library @ 2.6.8
  adafruit/Adafruit SHTC3 Library @ 1.0.2
  sensirion/Sensirion I2C SHT4x @ 1.1.2
  arduino-libraries/Arduino_LPS22HB @ 1.0.3
  adafruit/Adafruit MLX90614 Library @ 2.1.6
  adafruit/Adafruit_VL53L0X @ 1.2.5
  stevemarple/MicroNMEA @ 2.0.6
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit BMP085 Library @ 1.2.4

; ----------------------------------------------------------------------------------------------
; The images: one section per role-on-board-in-band, and one per band
; ----------------------------------------------------------------------------------------------

; An image is **one role on one board in one band** (spec/FIRMWARE-MANIFEST.md section 2), and
; these are the only places any of those three strings is written. Everything else derives from
; them and nothing restates them:
;
;   the environment's name   <role>_<board with its hyphens as underscores>
;   TWINOAK_ROLE/BOARD/BAND  the defines the environment passes, from which the firmware builds
;                            its image descriptor (src/common/fwdesc/), the role in its version
;                            string and the `role`, `board` and `slot` of the box link's HELLO
;   buildinfo.json           tools/pio/buildinfo.py reads the three defines out of the build
;   the manifest entry       tools/release/build_release.py reads buildinfo.json; the image `id`
;                            is <role>.<board>.<band>
;
; test/test_image reads this file and holds each of those against it, so a name that drifts is a
; red test and not a wrong image. The strings are spelled as FIRMWARE-MANIFEST.md spells them:
; the board is "rak4630-single" with a hyphen, where the environment's name has an underscore.
;
; **Adding a role or a board** is a section here, an [env:...] below, a directory under
; src/roles/ or a row in src/common/board/Boards.h (docs/ARCHITECTURE.md section 8).
[img_repeater_rak4630_single]
role = repeater
board = rak4630-single
band = 868

; NoiseScope, the SX1262 spectrum and noise scanner, on the same board and in the same band: it
; is flashed in place of the repeater when a site has a noise problem and the repeater is flashed
; back afterwards (docs/noisescope.md). Its role byte in the descriptor is 3
; (spec/FIRMWARE-MANIFEST.md section 4) and it is the one role of this family that speaks text
; and not frames on the box link's UART (spec/LINK-PROTOCOL.md section 9).
[img_scanner_rak4630_single]
role = scanner
board = rak4630-single
band = 868

; One block per band: what the radio defaults to where that band is used. A 433 MHz module is a
; different part and must never be given an 868 image, so the band is not a label - and a build
; whose band and default frequency disagree does not compile (src/common/bands/BandCheck.cpp
; holds LORA_FREQ against the table of src/common/bands/Bands.h). 433 has no block yet: the
; mechanism is proved with a made-up band in test/test_image rather than with a block nobody has
; measured a radio against.
;
; 868 is the Danish MeshCore channel - 869.618 MHz, 62.5 kHz, SF8, CR8, +22 dBm (MeshCore
; Denmark, EU Narrow), inside the EU's 863-870 MHz allocation.
;
; duty_cycle is the band's legal ceiling and belongs here with the frequency and the power, for
; the same reason they do: it is a property of the band the module is certified in and not a
; judgement anybody makes per site. 869.618 MHz is in the 869.400-869.650 MHz sub-band of ERC
; Recommendation 70-03, Annex 1, row h1.7 - 500 mW e.r.p. and a duty cycle of 10 %, or LBT+AFA
; instead, which this firmware does not claim (Edition of June 2024, the newest CEPT lists;
; docs/ARCHITECTURE.md's duty-cycle section says what was read and what was not), so a fresh
; unit must start at 10 and not at upstream's 50 %
; (MyMesh's constructor sets airtime_factor to 1.0 - examples/simple_repeater/MyMesh.cpp:890 at
; the pin - and 1/(1+1) of the one-hour window is half of it). The first-boot profile's second
; line is built from this number (src/roles/repeater/firstboot/Profile.cpp) and
; src/common/bands/Bands.h's row carries it, so the two cannot disagree; a *lower* value is
; still a site's to send afterwards.
[band_868]
freq = 869.618
bw = 62.5
sf = 8
cr = 8
tx_power = 22
duty_cycle = 10

[platformio]
default_envs = repeater_rak4630_single

; ----------------------------------------------------------------------------------------------
; MeshCore's [arduino_base] and [nrf52_base], as a library consumer sees them
; ----------------------------------------------------------------------------------------------

; MeshCore's root platformio.ini, [arduino_base] and [nrf52_base] at the pin, composed. Three of
; upstream's flags are deliberately absent:
;   -w                      inhibits every warning, and GCC's -w wins over a later -Wall whatever
;                           the order - with it the -Werror of build_src_flags would say nothing
;                           (the agent firmware's bootstrap report found that). Without it the
;                           whole build, upstream included, prints some warning lines; that is
;                           the price of a strict build of our own sources.
;   ENABLE_PRIVATE_KEY_IMPORT, ENABLE_PRIVATE_KEY_EXPORT
;                           upstream's own comment says to remove them for a more secure
;                           firmware; a unit's identity is generated on it and never leaves it.
; MESH_PACKET_LOGGING and MESH_DEBUG are never enabled, in any environment: nothing the mesh says
; is logged as text (spec/SYSTEM.md S-12).
; ----------------------------------------------------------------------------------------------
; RadioLib, configured once for every image of this board
; ----------------------------------------------------------------------------------------------

; MeshCore's own RADIOLIB_EXCLUDE_* lines, from its [arduino_base] at the pin, in a section of
; their own rather than inside the copy of [nrf52_base] below. Two reasons, and they are the same
; reason: a board carries one radio and an image of either role may be flashed on it, so the
; driver in the two images must be built the same way - and a RadioLib bump then has one list to
; re-read (docs/upstream.md). Every environment that drives the SX1262 takes these from here; the
; exact version is ${libs.radiolib}.
;
; RADIOLIB_STATIC_ONLY and RADIOLIB_GODMODE are **not** here. The first is upstream's and is in
; [nrf52_base] with the rest of upstream's flags; the second is upstream's too, and the scanner
; does not set it - every spectral-scan call it makes is public API on this version
; (.pio/libdeps/<env>/RadioLib/src/modules/SX126x/SX126x.h at 7.8.0), and without the define
; RadioLib's "God mode active" #warning is not raised in that build at all.
[radiolib]
exclude =
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1

[nrf52_base]
framework = arduino
; Pinned, as every other dependency here is: the toolchain the platform resolves is part of the
; build. Upstream says `nordicnrf52` with no version; this is the newest release on the day the
; first build was made, and a bump of it is a deliberate line in a pull request.
platform = platformio/nordicnrf52@11.0.0
platform_packages =
  ; MeshCore's own fork of the Adafruit nRF52 core, at the commit upstream pins ([nrf52_base]:
  ; a patch to the BLE stack against lockups during rapid connect/disconnect). NoiseScope in the
  ; hardware repository is pinned to the same commit, so the two firmwares a repeater swaps
  ; between run the same core.
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
monitor_speed = 115200
build_flags =
  -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  ; LORA_FREQ, LORA_BW, LORA_SF, LORA_CR and LORA_TX_POWER are **not** here: they differ by band
  ; and each board environment takes them from the [band_*] block its own band names. Upstream
  ; keeps the first three in [nrf52_base]; this firmware builds more than one band.
  -D ENABLE_ADVERT_ON_BOOT=1
  ${radiolib.exclude}
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
  ; Not upstream's: the Adafruit core's Uart holds SERIAL_BUFFER_SIZE bytes of receive ring and
  ; the same of transmit buffer, and its default of 64 (cores/nRF5/RingBuffer.h, #ifndef-guarded)
  ; is neither enough for one 246-byte frame of the box link nor enough to write one without
  ; blocking (cores/nRF5/Uart.cpp copies at most SERIAL_BUFFER_SIZE bytes per write). 256 holds a
  ; whole frame either way (src/common/link/SerialTransport.h says the rest). The define is the core's
  ; only lever and it is global, so it costs 1536 bytes of RAM in four places that are not
  ; Serial1: Serial2, which the core instantiates beside it, and the two RingBuffers of each of
  ; Wire and Wire1 (libraries/Wire/Wire.h). Roomier I2C buffers harm nothing; the figure is in
  ; tasks/phase-1/reports/03.md with the rest of the link's RAM.
  -D SERIAL_BUFFER_SIZE=256
; build_src_flags reaches src/ only: a warning in a file of ours is a red build, and upstream's
; warnings are not ours to fix - including the ones the compiler meets in upstream's headers while
; it compiles a file of ours, which src/common/board/UpstreamHeaders.h keeps out of -Werror by including
; them as system headers. -Wno-error=cpp is for the one thing that does not silence, a #warning
; directive (RadioLib's about RADIOLIB_GODMODE): it stays a warning, as in the agent firmware.
build_src_flags = -Wall -Wextra -Werror -Wno-error=cpp
; Our exact versions come first and MeshCore after them: PlatformIO installs lib_deps in order and
; resolves a dependency's own ranges against what is already installed, so the RadioLib it finds
; for MeshCore's "^7.6.0" is the 7.8.0 above. The other way round, MeshCore's range fetched the
; newest release into a second directory (RadioLib@7.8.1 beside RadioLib) - unused by the build,
; but a copy nobody asked for.
lib_deps =
  ${libs.core}
  ${libs.nrf52}
  ${meshcore.url}#${meshcore.pin}

; ----------------------------------------------------------------------------------------------
; The boards
; ----------------------------------------------------------------------------------------------

; The repeater role on the single-RAK adapter (RAK4630 stamp: nRF52840 + SX1262). Upstream's
; simple_repeater example from the pin - MyMesh.{h,cpp}, byte for byte - under our application:
; src/roles/repeater/main.cpp constructs a TwinOakMesh (src/roles/repeater/app/, a subclass of MyMesh) and src/common/board/target.cpp
; is the board target (docs/ARCHITECTURE.md sections 2 and 3; phase 1's task 01 is the proof).
;
; The flags are MeshCore's variants/rak4631/platformio.ini [rak4631] and [env:RAK_4631_repeater]
; plus its root [sensor_base], at the pin. Two defines tell upstream's build_as_lib.py which of
; MeshCore's own sources to compile, and one is deliberately absent:
;   BUILD_EXAMPLE         examples/simple_repeater/*.cpp (MyMesh.cpp, UITask.cpp - and main.cpp,
;                         but for the next line)
;   EXCLUDE_FROM_EXAMPLE  leaves main.cpp of the example out: ours is src/roles/repeater/main.cpp. build_as_lib.py
;                         reads the defines in order and this one must follow BUILD_EXAMPLE.
;                         UITask.cpp is still compiled; without DISPLAY_CLASS nothing references
;                         it and the linker leaves it out.
;   (no MC_VARIANT)       with it, build_as_lib.py would compile all of variants/rak4631/ - its
;                         target.cpp included, which is the file src/common/board/target.cpp replaces.
;                         The two variant files still upstream's, RAK4631Board.cpp and the Arduino
;                         variant.cpp, are compiled out of the pinned checkout by
;                         tools/pio/meshcore_variant.py instead (the Adafruit core at this pin has
;                         no WisCore_RAK4631_Board variant of its own, so variant.cpp has to come
;                         from MeshCore's tree - as it does in upstream's build).
; The include order matters for one file: upstream's MyMesh.h does `#include <target.h>`, so
; src/common/board comes first on the path and variants/rak4631 (still needed for variant.h's LoRa pins
; and RAK4631Board.h) after it.
;
; Left out of upstream's blocks, on purpose:
;   DISPLAY_CLASS         there is no display on the adapter; without the define upstream's
;                         UITask and our target build no UI
;   ENV_INCLUDE_GPS, PIN_GPS_RX/TX/EN
;                         Serial1 is the link to the Walter on our adapter, not a GPS; upstream's
;                         own RS232-bridge environments leave the GPS out the same way (they
;                         -UENV_INCLUDE_GPS). This also drops the SparkFun u-blox GNSS library
;                         the RAK GPS path needs.
;   ENV_INCLUDE_BME680_BSEC, -UENV_INCLUDE_BME680, fix_bsec_lib.py
;                         Bosch's BSEC is a binary blob whose packaging needs upstream's
;                         post-script to link; the unit has a BME280, not a BME680. The sensor
;                         manager is compiled with the open Adafruit BME680 driver instead, as
;                         [sensor_base] has it and as the agent firmware does.
;   ENV_INCLUDE_RAK12035  the WisBlock soil-moisture sensor, not fitted; its driver still
;                         compiles (helpers/sensors is unconditional in build_as_lib.py)
;   ENV_INCLUDE_INA3221   upstream's INA3221 support applies one shunt value to all three
;                         channels and ours are 100, 20 and 50 milliohm (docs/ARCHITECTURE.md
;                         section 3); src/common/power/ reads the INA3221 itself. The library still
;                         compiles, unused, because helpers/sensors is unconditional.
;   ENV_INCLUDE_BME280    upstream's BME280 support samples the part *inside* querySensors -
;                         MODE_FORCED, then takeForcedMeasurement() spins on the status register
;                         (EnvironmentSensorManager.cpp:271-290 at the pin) - and querySensors is
;                         on the path of the box link's LPP_GET, which must never perform I2C or
;                         wait for a conversion. src/common/power/Environment.h reads the part in normal
;                         mode on a schedule instead, and one cached sample then serves ENV_GET,
;                         LPP_GET and the mesh alike. The Adafruit driver is still a pinned
;                         dependency: it is what src/common/power/BoardPower.cpp uses for Bosch's
;                         compensation arithmetic. test/test_rails holds this define and the one
;                         above out of every board environment.
;   Adafruit SSD1306, SparkFun u-blox GNSS, BSEC
;                         the libraries of the three things above
;   MESH_PACKET_LOGGING, MESH_DEBUG
;                         never (spec/SYSTEM.md S-12); test/test_rails reads this file for them
; ADMIN_PASSWORD is defined - upstream's constructor needs a value, and without the define its
; MyMesh.cpp defaults to the word every stock repeater ships with - as a string nobody is meant to
; use: on a boot that finds no saved preferences src/roles/repeater/app/FirstBoot.cpp overwrites it with a random
; one before loop() ever runs, and from then on the saved one is loaded over it (spec/SYSTEM.md
; S-13). test/test_rails fails a board environment that leaves it out or sets it to upstream's
; word.
; The radio's five band defaults and the band's duty cycle come from [band_868] above and are
; written nowhere else; a build whose band and frequency disagree does not compile
; (src/common/bands/BandCheck.cpp), and neither does one whose duty cycle is not the one that
; band's row carries (src/roles/repeater/firstboot/Profile.cpp, which is what the number is for).
;
; The two TWINOAK_MESHCORE_* defines carry the pin into the firmware string
; src/common/version/Version.cpp builds, so a bump moves them with the pin and never by hand.
; TWINOAK_FW_VERSION is given by the release build (.github/workflows/release.yml); without it
; the string says 0.0.0-dev.
;
; TWINOAK_ROLE, TWINOAK_BOARD and TWINOAK_BAND are the three strings that identify an image -
; the manifest's role, board and band and the image descriptor's (spec/FIRMWARE-MANIFEST.md
; sections 2 and 4). They are not written here: they are [img_repeater_rak4630_single] above,
; which is also what names this environment. tools/pio/buildinfo.py writes them, the MCU and the
; linker script of the build into $BUILD_DIR/buildinfo.json, which is what the release tooling
; reads instead of being told, and tools/pio/descriptor.py holds the descriptor in the linked
; image against the same three before the build is allowed to succeed.
;
; build_src_filter compiles src/common/ and this role's directory and nothing of another role's
; (docs/ARCHITECTURE.md section 8).
[env:repeater_rak4630_single]
extends = nrf52_base
; boards/rak4631.json, vendored from the pin: PlatformIO reads boards_dir before it clones a
; dependency (boards/README.md). The RAK4630 stamp is the RAK4631 core module, same pin map.
board = rak4631
extra_scripts =
  pre:tools/pio/meshcore_private_libs.py
  post:tools/pio/meshcore_uf2.py
  post:tools/pio/meshcore_variant.py
  post:tools/pio/buildinfo.py
  post:tools/pio/descriptor.py
  post:tools/pio/linkmap.py
; src/common/ and this role's directory, and nothing of another role's.
build_src_filter =
  +<common/>
  +<roles/repeater/>
build_flags =
  ${nrf52_base.build_flags}
  -I $PROJECT_DIR/src/common/board
  -I ${meshcore.dir}/variants/rak4631
  -I ${meshcore.dir}/examples/simple_repeater
  -I ${meshcore.dir}/lib/ed25519
  -D BUILD_EXAMPLE=simple_repeater
  -D EXCLUDE_FROM_EXAMPLE=main.cpp
  -D ADMIN_PASSWORD='"not-a-password"'
  -D TWINOAK_MESHCORE_TAG='"${meshcore.tag}"'
  -D TWINOAK_MESHCORE_PIN='"${meshcore.pin}"'
  -D TWINOAK_ROLE='"${img_repeater_rak4630_single.role}"'
  -D TWINOAK_BOARD='"${img_repeater_rak4630_single.board}"'
  -D TWINOAK_BAND='"${img_repeater_rak4630_single.band}"'
  ; The radio, from the band this image is in. A 433 build of this board is a second [img_*]
  ; section, a [band_433] block and a second environment - not a flag changed here. The five
  ; LORA_* are upstream's own defines; TWINOAK_BAND_DUTY_CYCLE is ours, and the only thing that
  ; reads it is the first-boot profile's `set dutycycle` line
  ; (src/roles/repeater/firstboot/Profile.cpp, which refuses to compile without it).
  -D LORA_FREQ=${band_868.freq}
  -D LORA_BW=${band_868.bw}
  -D LORA_SF=${band_868.sf}
  -D LORA_CR=${band_868.cr}
  -D LORA_TX_POWER=${band_868.tx_power}
  -D TWINOAK_BAND_DUTY_CYCLE=${band_868.duty_cycle}
  -D RAK_4631
  -D RAK_BOARD
  -D NRF52_POWER_MANAGEMENT
  -D PIN_BOARD_SCL=14
  -D PIN_BOARD_SDA=13
  -D PIN_OLED_RESET=-1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ADVERT_NAME='"RAK4631 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D MAX_NEIGHBOURS=50
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  ${nrf52_base.lib_deps}
  ${libs.sensors}

; The scanner role on the same adapter: NoiseScope, moved here from the hardware repository
; (phase 3's task 02; docs/noisescope.md). Same board, same pins, same board target for I2C and
; the same release - and no MeshCore at all.
;
; **What it shares with the repeater, and what it does not.** build_src_filter compiles this
; role's directory and the files of src/common/ it uses - and it is a list rather than
; +<common/>, because three files of common/ are MeshCore's side of the build
; (board/target.cpp, which exists to be upstream's <target.h>; link/SerialTransport.cpp, the box
; link's frames; power/BoardPower.cpp, which keeps a preferences file in the internal flash) and
; this image compiles none of MeshCore and opens no file. A file this role needs and that is not
; listed does not link, and that is the loud end of the trade (docs/ARCHITECTURE.md section 8).
;
; **MeshCore is in lib_deps and ignored.** The scanner compiles not one line of it - lib_ignore
; keeps the library out of the build entirely, so build_as_lib.py never runs - but the pinned
; checkout has to be on disk, because the Adafruit core at this pin has no WisCore_RAK4631_Board
; variant of its own: variant.h (the SX1262's pins, the RF switch, the TCXO, SX126X_POWER_EN)
; comes from upstream's tree through the -I below, variant.cpp is compiled out of it by
; tools/pio/meshcore_variant.py, and the UF2 converter the release needs is read out of it by
; tools/pio/meshcore_uf2.py. That is the same arrangement the repeater has for the same three
; things; what differs is that here it is all of MeshCore this build uses.
;
; The flags, line by line, against the repeater's:
;   NDEBUG, RADIOLIB_STATIC_ONLY, ${radiolib.exclude}, SERIAL_BUFFER_SIZE
;                            the same radio driver and the same UART buffers - one board, one
;                            core configuration, and a reading is only comparable with the
;                            repeater's if the driver is the same one ([radiolib] says why)
;   SX126X_CURRENT_LIMIT, SX126X_RX_BOOSTED_GAIN
;                            the RX path's own two, the repeater's values. The RF switch and the
;                            TCXO voltage are the variant's and are not written here either
;   LORA_FREQ/BW/SF/CR       from [band_868], as the repeater takes them: the monitor listens on
;                            the channel the repeater of the same band would
;                            (src/roles/scanner/config.h). **LORA_TX_POWER is absent** - this
;                            image has no transmit power because it never transmits
;   -Wl,-u,_printf_float     newlib-nano leaves %f out of snprintf unless something asks for it,
;                            and every NDJSON number is a %f (src/roles/scanner/Lines.cpp)
;   TWINOAK_MESHCORE_TAG/PIN the pin this image was built against - true of it as well: its
;                            Arduino pin map is upstream's, out of that commit
;   (no ADMIN_PASSWORD)      there is no admin and no mesh. test/test_rails holds the rail that
;                            needs it to the environments that compile upstream's example
;   (no ENABLE_ADVERT_ON_BOOT, NRF52_PLATFORM, EXTRAFS, LFS_NO_ASSERT, USE_CC310_HW_CRYPTO,
;    DISPLAY_CLASS, ENV_INCLUDE_*, RADIO_CLASS, WRAPPER_CLASS, MAX_NEIGHBOURS, ADVERT_*)
;                            all of them MeshCore's, and MeshCore is not in this build
[env:scanner_rak4630_single]
extends = nrf52_base
board = rak4631
lib_ignore = MeshCore
extra_scripts =
  post:tools/pio/meshcore_uf2.py
  post:tools/pio/meshcore_variant.py
  post:tools/pio/buildinfo.py
  post:tools/pio/descriptor.py
  post:tools/pio/linkmap.py
  ; Where the loop watchdog's marker lives: a word of RAM that Reset_Handler neither copies into
  ; nor zeroes, so that it survives the soft reset the 8 s loop check ends in and `boot` can say
  ; `wdt` for it (src/roles/scanner/loopwdt.ld says why after .bss, before .heap and NOLOAD; this
  ; script says why it is a script and not a build flag).
  post:tools/pio/loopwdt.py
; This role's directory, and the files of src/common/ it uses - in the tree's own order, as
; [env:native]'s list is.
build_src_filter =
  -<*>
  +<common/bands/>
  +<common/fwdesc/>
  +<common/power/Ina3221.cpp>
  +<common/power/PowerReader.cpp>
  +<common/power/WireBus.cpp>
  +<common/version/>
  +<roles/scanner/>
  ; The vendored sweep plugin's source is a program for the **radio's** core (CoolRISC 816), not
  ; for this one: it is checked in to be read beside the 167 words it produced, and the assembler
  ; that built it is not vendored (docs/noisescope.md section 6). Without this line PlatformIO
  ; hands it to arm-none-eabi-as, which has opinions about `move r3, [P_NUM]`.
  -<roles/scanner/vendor/sx126x_spectrum/spectrum.asm>
build_flags =
  -DNDEBUG -DRADIOLIB_STATIC_ONLY=1
  ${radiolib.exclude}
  -D SERIAL_BUFFER_SIZE=256
  -Wl,-u,_printf_float
  -I ${meshcore.dir}/variants/rak4631
  -D TWINOAK_MESHCORE_TAG='"${meshcore.tag}"'
  -D TWINOAK_MESHCORE_PIN='"${meshcore.pin}"'
  -D TWINOAK_ROLE='"${img_scanner_rak4630_single.role}"'
  -D TWINOAK_BOARD='"${img_scanner_rak4630_single.board}"'
  -D TWINOAK_BAND='"${img_scanner_rak4630_single.band}"'
  -D LORA_FREQ=${band_868.freq}
  -D LORA_BW=${band_868.bw}
  -D LORA_SF=${band_868.sf}
  -D LORA_CR=${band_868.cr}
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
lib_deps =
  ${libs.scanner}
  ${meshcore.url}#${meshcore.pin}

; ----------------------------------------------------------------------------------------------
; The tests that need no board
; ----------------------------------------------------------------------------------------------

; A host build: no Arduino, no MeshCore, no radio. The host-portable files of src/ are compiled
; beside the tests (test_build_src), and only those: the filter starts empty and lists them one
; by one, because everything else in src/ needs a board. The list is in the tree's own order -
; src/common/ first, then the role's.
;
; The TWINOAK_* defines are a board environment's own, so that what is compiled here says what
; it says on the board: the MeshCore pin for src/common/version/Version.cpp, and the three names
; of [img_repeater_rak4630_single] for the version string's role and for the image descriptor
; src/common/fwdesc/ImageDescriptor.cpp builds. test/test_image reads this file and fails if
; those three are not one of its [img_*] sections, so the copy here cannot drift. The band's duty
; cycle is here for the same reason: src/roles/repeater/firstboot/Profile.cpp builds the profile's
; `set dutycycle` line from it, and test/test_firstboot holds that line to the band's own row.
;
; PROJECT_DIR is for test/test_rails and test/test_image, which read this file and walk src/;
; FIXTURES_DIR and MANIFEST_FIXTURES_DIR are how the tests find spec/fixtures/ without assuming
; the working directory pio test runs them from, as the agent firmware's native environment does
; it. The board's C++ standard is the Adafruit nRF52 core's gnu++11 (the platform's
; builder/frameworks/arduino/adafruit.py), so everything under src/common/ is written to C++11
; and compiled here as C++17 - the tests themselves are the only C++17 in this repository.
; On Windows this environment runs in a container (tasks/RUNBOOK.md section 2; tools/verify.ps1
; does that by itself).
[env:native]
platform = native
test_framework = googletest
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -D TWINOAK_MESHCORE_TAG='"${meshcore.tag}"'
  -D TWINOAK_MESHCORE_PIN='"${meshcore.pin}"'
  -D TWINOAK_ROLE='"${img_repeater_rak4630_single.role}"'
  -D TWINOAK_BOARD='"${img_repeater_rak4630_single.board}"'
  -D TWINOAK_BAND='"${img_repeater_rak4630_single.band}"'
  -D TWINOAK_BAND_DUTY_CYCLE=${band_868.duty_cycle}
  -D PROJECT_DIR='"$PROJECT_DIR"'
  -D FIXTURES_DIR='"$PROJECT_DIR/spec/fixtures/link"'
  -D MANIFEST_FIXTURES_DIR='"$PROJECT_DIR/spec/fixtures/manifest"'
build_src_filter =
  -<*>
  +<common/fwdesc/Descriptor.cpp>
  +<common/fwdesc/ImageDescriptor.cpp>
  +<common/link/attention/Attention.cpp>
  +<common/link/codec/Bytes.cpp>
  +<common/link/codec/Cobs.cpp>
  +<common/link/codec/Crc16.cpp>
  +<common/link/codec/FrameReceiver.cpp>
  +<common/link/codec/FrameWriter.cpp>
  +<common/link/codec/Messages.cpp>
  +<common/link/codec/Packet.cpp>
  +<common/link/session/ResetReason.cpp>
  +<common/link/session/Session.cpp>
  +<common/power/BatteryWatch.cpp>
  +<common/power/Environment.cpp>
  +<common/power/Ina3221.cpp>
  +<common/power/LinkPower.cpp>
  +<common/power/PowerReader.cpp>
  +<common/power/Prefs.cpp>
  +<common/power/Telemetry.cpp>
  +<common/version/Version.cpp>
  +<roles/repeater/app/AdminPassword.cpp>
  +<roles/repeater/app/Settings.cpp>
  +<roles/repeater/clock/ClockKeeper.cpp>
  +<roles/repeater/firstboot/Profile.cpp>
  +<roles/repeater/meshclient/Job.cpp>
  +<roles/repeater/meshclient/LinkMeshClient.cpp>
  +<roles/repeater/meshclient/LinkObservations.cpp>
  +<roles/repeater/meshclient/ObservationRing.cpp>
  +<roles/repeater/meshclient/Reply.cpp>
  +<roles/repeater/meshclient/SendCeiling.cpp>
  +<roles/scanner/Commands.cpp>
  +<roles/scanner/Lines.cpp>
  +<roles/scanner/LoopWatch.cpp>
  +<roles/scanner/Sweep.cpp>
; ArduinoJson is already one of [libs].core above, at the same exact version: here it is the
; fixture reader of test/test_link_codec, which reads spec/fixtures/link/link-v1.json at run time
; (the agent firmware's test_config_read does the same with the same library).
lib_deps =
  google/googletest @ 1.17.0
  bblanchon/ArduinoJson @ 7.4.3
